<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>連江縣政府工務處都計建管科 - 馬祖四鄉五島微縮實物模型與公文效能 3D 生態島</title>
  <!-- 思源黑體與宋體標題 Web Font 優先載入 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-title: #0c335e;
      --coral: #d4652f;
      --nangan-ochre: #c57b30;
      --beigan-olive: #586e33;
      --dongyin-teal: #1c6472;
      --chukuang-purple: #6c4f8f;
      --ink: #1b2530;
      --cream: #fffdfa;
      --yellow: #fce881;
      --shadow: 0 14px 34px rgba(12, 51, 94, 0.16);
      --font-main: "Noto Sans TC", "Source Han Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      --font-serif: "Noto Serif TC", "Source Han Serif TC", serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      font-family: var(--font-main);
      background: radial-gradient(circle at 50% 45%, #eef9fd 0%, #bce3f2 65%, #9bd2e8 100%);
      color: var(--ink);
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 底圖氛圍背景層 (呼應上傳之馬祖四鄉五島水彩海圖色調) */
    #bg-map-backdrop {
      position: fixed; inset: -16px; z-index: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(18px) saturate(1.12) brightness(1.04);
      opacity: 0.42;
      transition: opacity 0.6s ease, filter 0.6s ease;
      pointer-events: none;
    }
    body.night-mode #bg-map-backdrop {
      filter: blur(18px) saturate(0.85) brightness(0.28) hue-rotate(12deg);
      opacity: 0.6;
    }
    body.sunset-mode #bg-map-backdrop {
      filter: blur(18px) saturate(1.25) sepia(0.22) brightness(0.86);
      opacity: 0.5;
    }

    #canvas-container { width: 100%; height: 100%; position: absolute; inset: 0; z-index: 1; touch-action: none; }

    /* 毛玻璃通用面板 */
    .glass-card {
      background: rgba(255, 253, 250, 0.90);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      box-shadow: var(--shadow);
      z-index: 10;
      position: absolute;
    }

    /* 左上標題看板 (完全呼應上傳地圖之深海藍與金棕配色風格) */
    #brand-header {
      top: 18px; left: 22px; padding: 14px 20px;
      display: flex; flex-direction: column; gap: 4px;
      max-width: 460px; pointer-events: auto;
    }
    #brand-header .header-top-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    #brand-header .sub-badge {
      font-size: 11px; font-weight: 800; color: #fff; background: var(--navy-title);
      padding: 3px 11px; border-radius: 999px; width: fit-content; letter-spacing: 0.8px;
    }
    #perf-hud {
      font-size: 10.5px; font-weight: 800; color: var(--dongyin-teal); background: rgba(230, 247, 252, 0.95);
      border: 1px solid #b3e0ec; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.3px;
      font-variant-numeric: tabular-nums;
    }
    #brand-header h1 {
      font-family: var(--font-serif);
      font-size: 19px; font-weight: 900; color: var(--navy-title); letter-spacing: 1px;
    }
    #brand-header p { font-size: 11px; color: #4a5a6a; font-weight: 700; line-height: 1.4; }

    /* 頂部指示燈條 */
    #top-nav-ticker {
      top: 18px; left: 50%; transform: translateX(-50%);
      padding: 8px 22px; border-radius: 999px; font-size: 12.5px; font-weight: 800;
      color: #fff; background: rgba(12, 51, 94, 0.90); box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 8px; z-index: 10; position: absolute;
      letter-spacing: 0.5px; white-space: nowrap; pointer-events: none;
      border: 1px solid rgba(255,255,255,0.25);
    }
    #top-nav-ticker span.dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); flex-shrink: 0;
      box-shadow: 0 0 8px var(--yellow);
      animation: pulseDot 2s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.7; }
    }

    /* 右上功能選單組 */
    #top-dock {
      top: 18px; right: 22px; display: flex; gap: 7px; z-index: 10; position: absolute;
    }
    .dock-btn {
      background: rgba(255, 253, 250, 0.94); border: 1.5px solid #cfe2ec;
      padding: 8px 14px; border-radius: 12px; cursor: pointer; font-size: 12px;
      font-weight: 800; font-family: var(--font-main); display: flex; align-items: center; gap: 5px;
      box-shadow: 0 4px 12px rgba(12, 51, 94, 0.08); transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      color: var(--navy-title);
    }
    .dock-btn:hover { background: var(--yellow); transform: translateY(-2px); border-color: var(--nangan-ochre); }

    /* 右側詳細資訊抽屜面板 */
    #detail-drawer {
      top: 74px; right: 22px; width: 400px; max-height: calc(100vh - 165px);
      overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 13px;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
      z-index: 15;
    }
    #detail-drawer.hidden { transform: translateX(440px); opacity: 0; pointer-events: none; }
    .drawer-title-row { display: flex; justify-content: space-between; align-items: center; }
    .drawer-title { font-size: 18px; font-weight: 900; color: var(--navy-title); }
    .drawer-badge { padding: 4px 11px; border-radius: 999px; background: #e8f3f8; font-size: 11px; font-weight: 800; color: var(--navy-title); width: fit-content; }
    
    /* 統計指標磚 */
    .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .metric-card {
      background: rgba(255, 255, 255, 0.92); border: 1px solid #d9e8f0;
      padding: 9px 12px; border-radius: 12px;
    }
    .metric-card .num { font-size: 16px; font-weight: 900; color: var(--coral); font-family: var(--font-main); }
    .metric-card .label { font-size: 11px; color: #667; margin-top: 2px; }

    /* 承辦人員 Tag (附考核榮譽) */
    .officer-tag {
      display: flex; flex-direction: column; gap: 4px; padding: 9px 12px;
      background: #fff; border: 1px solid #d9e8f0; border-radius: 10px; font-size: 12px;
      transition: border-color 0.2s, transform 0.2s;
    }
    .officer-tag:hover { border-color: var(--coral); transform: translateX(2px); }
    .officer-tag .name-row { display: flex; justify-content: space-between; font-weight: 800; align-items: baseline; }
    .officer-tag .award-pill {
      font-size: 10.5px; background: #fdf5ea; color: #c85a32; padding: 2px 7px;
      border-radius: 4px; border: 1px solid #f6d8b8; width: fit-content; margin-top: 2px;
    }

    /* 底部控制列 */
    #bottom-control-bar {
      bottom: 20px; left: 50%; transform: translateX(-50%);
      padding: 7px 16px; display: flex; gap: 5px; align-items: center;
      border-radius: 999px; z-index: 10;
    }
    .ctrl-btn {
      background: transparent; border: none; font-size: 12px; font-weight: 800;
      font-family: var(--font-main); color: var(--navy-title);
      padding: 7px 12px; border-radius: 999px; cursor: pointer; transition: 0.2s;
      display: flex; align-items: center; gap: 5px; white-space: nowrap;
    }
    .ctrl-btn:hover, .ctrl-btn.active {
      background: var(--navy-title); color: #fff; box-shadow: 0 3px 10px rgba(12, 51, 94, 0.22);
    }

    /* 浮動 CSS2D 膠囊名牌 (完全比照上傳地圖之四鄉專屬膠囊色票) */
    .island-badge {
      color: #fff; padding: 4px 13px 4px 6px;
      border-radius: 999px; font-size: 12px; font-weight: 900;
      border: 2px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 6px 16px rgba(12, 51, 94, 0.28);
      pointer-events: auto; cursor: pointer;
      display: flex; align-items: center; gap: 6px; white-space: nowrap;
      transform: translateY(-18px);
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s, border-color 0.2s;
      letter-spacing: 0.5px;
    }
    .island-badge[data-town="nangan"] { background: var(--nangan-ochre); }
    .island-badge[data-town="beigan"] { background: var(--beigan-olive); }
    .island-badge[data-town="dongyin"] { background: var(--dongyin-teal); }
    .island-badge[data-town="chukuang"] { background: var(--chukuang-purple); }

    .island-badge:hover { transform: translateY(-23px) scale(1.07); border-color: var(--yellow); }
    .island-badge .pill-num {
      background: rgba(255,255,255,0.24); color: #fff; width: 19px; height: 19px;
      border-radius: 50%; font-size: 10px; display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255,255,255,0.6);
    }
    .island-badge.active {
      border-color: var(--yellow);
      box-shadow: 0 0 0 3px rgba(252, 232, 129, 0.55), 0 8px 20px rgba(0,0,0,0.35);
      transform: translateY(-24px) scale(1.1);
    }

    /* 底部跑馬字幕 */
    #subtitle-bar {
      bottom: 76px; left: 50%; transform: translateX(-50%);
      background: rgba(12, 51, 94, 0.88); color: #fff; padding: 8px 22px;
      border-radius: 14px; font-size: 12.5px; font-weight: 700; z-index: 10;
      box-shadow: var(--shadow); max-width: 800px; text-align: center; pointer-events: none;
      line-height: 1.5; position: absolute; border: 1px solid rgba(255,255,255,0.2);
    }

    /* 彈出視窗模組 */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(12, 32, 56, 0.58);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      z-index: 100; display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--cream); border-radius: 24px; width: 94%; max-width: 880px;
      max-height: 85vh; overflow-y: auto; padding: 28px; box-shadow: var(--shadow);
      position: relative; border: 1.5px solid #fff;
    }
    .modal-close {
      position: absolute; top: 18px; right: 18px; width: 34px; height: 34px;
      border-radius: 50%; border: none; background: #eee; cursor: pointer; font-weight: 900;
      font-size: 16px; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .modal-close:hover { background: #dedede; }

    /* 載入遮罩 */
    #loader {
      position: fixed; inset: 0; background: #d6eef8; z-index: 999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; font-weight: 900; color: var(--navy-title); transition: opacity 0.35s ease;
    }
    .spinner {
      width: 48px; height: 48px; border: 4px solid rgba(12, 51, 94, 0.18);
      border-top-color: var(--coral); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 行動裝置 / 平板 RWD 響應式佈局 */
    @media (max-width: 960px) {
      #brand-header {
        top: 10px; left: 10px; right: 10px; max-width: none;
        padding: 10px 14px; border-radius: 14px;
      }
      #brand-header h1 { font-size: 15px; }
      #brand-header p { display: none; }
      
      #top-dock {
        top: 62px; left: 10px; right: 10px;
        overflow-x: auto; padding-bottom: 4px;
        -webkit-overflow-scrolling: touch;
      }
      .dock-btn { font-size: 11px; padding: 6px 10px; flex-shrink: 0; }

      #top-nav-ticker {
        top: auto; bottom: 72px; max-width: 92%;
        font-size: 11px; padding: 6px 14px; overflow: hidden; text-overflow: ellipsis;
      }

      #detail-drawer {
        top: auto; bottom: 70px; left: 10px; right: 10px;
        width: auto; max-height: 58vh; border-radius: 18px;
        padding: 16px; transform: translateY(0);
      }
      #detail-drawer.hidden { transform: translateY(120%); opacity: 0; pointer-events: none; }

      #bottom-control-bar {
        bottom: 10px; left: 50%; width: 96%; max-width: 580px;
        padding: 6px 10px; overflow-x: auto; -webkit-overflow-scrolling: touch;
        justify-content: flex-start;
      }
      .ctrl-btn { font-size: 11px; padding: 6px 10px; flex-shrink: 0; }

      #subtitle-bar { display: none; }
    }
  </style>

  <!-- ES Modules 映射表 (Three.js 0.160.0 & Addons) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- 載入等待動畫 -->
  <div id="loader">
    <div class="spinner"></div>
    <div style="font-size: 15px; letter-spacing: 0.5px;">正在雕琢「馬祖・四鄉五島」微縮實物模型與即時波浪海圖…</div>
  </div>

  <!-- 底圖環境背景襯底 -->
  <div id="bg-map-backdrop"></div>

  <div id="canvas-container"></div>

  <!-- 左上標題看板 -->
  <div id="brand-header" class="glass-card">
    <div class="header-top-row">
      <div class="sub-badge">連江縣政府工務處都計建管科</div>
      <div id="perf-hud" title="即時海洋頂點波浪・微縮實物模型・雙向航行客輪">⚡ 60 FPS・頂點波浪</div>
    </div>
    <h1>馬祖・四鄉五島都計建管微縮生態島</h1>
    <p>福澳碼頭與媽祖神像・芹壁石屋與龜島・東引旋轉探照燈塔・莒光白犬燈塔發光</p>
  </div>

  <!-- 頂部指示燈條 -->
  <div id="top-nav-ticker">
    <span class="dot"></span>
    <span id="ticker-text">探索海上仙境・馬祖四鄉五島微縮實物模型與都計建管業務導覽</span>
  </div>

  <!-- 右上功能選單組 -->
  <div id="top-dock">
    <button class="dock-btn" onclick="toggleAudio()"><span id="audio-icon">🔊</span> 海潮環境音</button>
    <button class="dock-btn" onclick="openModal('dispatch')">📋 重大列管業務</button>
    <button class="dock-btn" onclick="openModal('performance')">📊 115年公文績效總表</button>
    <button class="dock-btn" onclick="openModal('eval')">🏆 業務考核評鑑成績</button>
    <button class="dock-btn" onclick="openModal('duties')">🏢 都計與建管權責</button>
  </div>

  <!-- 右側詳細資訊卡 (抽屜) -->
  <div id="detail-drawer" class="glass-card hidden">
    <div class="drawer-title-row">
      <div class="drawer-title" id="d-title">島嶼標題</div>
      <button onclick="closeDrawer()" style="background:none; border:none; font-size:20px; cursor:pointer; color:#777; line-height:1;" title="關閉 (Esc)">✕</button>
    </div>
    <div class="drawer-badge" id="d-subtitle">次標題</div>
    <div id="d-desc" style="font-size: 13px; line-height: 1.6; color:#444;"></div>
    
    <div style="font-size:12px; font-weight:800; color:var(--navy-title); margin-top:4px;">轄區主要承辦同仁與法定職掌</div>
    <div id="d-officers" style="display:flex; flex-direction:column; gap:8px;"></div>

    <div style="font-size:12px; font-weight:800; color:var(--navy-title); margin-top:4px;">115年度公文辦結效能數據</div>
    <div class="metric-grid" id="d-metrics"></div>

    <div style="border-top:1px dashed #c8dce6; padding-top:10px;">
      <div style="font-size:12px; font-weight:800; color:var(--navy-title); margin-bottom:4px;">重點列管都市計畫與建築管理專案</div>
      <div id="d-projects" style="font-size: 12px; line-height: 1.5; color:#555;"></div>
    </div>
  </div>

  <!-- 底部字幕提示條 -->
  <div id="subtitle-bar">
    微縮實物模型已整合「馬祖・四鄉五島」海圖、即時海洋頂點波浪與 6 艘雙向對開客輪；點選各島檢視都計建管業務與績效。
  </div>

  <!-- 底部控制工具列 -->
  <div id="bottom-control-bar" class="glass-card">
    <button class="ctrl-btn" onclick="prevIsland()" title="快捷鍵：←">◀ 上一站</button>
    <button class="ctrl-btn active" id="btn-tour" onclick="toggleAutoTour()" title="快捷鍵：空白鍵">⏸ 巡航中</button>
    <button class="ctrl-btn" onclick="nextIsland()" title="快捷鍵：→">下一站 ▶</button>
    <span style="color:#c5d8e2; user-select:none;">|</span>
    <button class="ctrl-btn time-btn active" id="btn-day" onclick="setTimeMode('day', this)">☀️ 白晝</button>
    <button class="ctrl-btn time-btn" id="btn-sunset" onclick="setTimeMode('sunset', this)">🌅 夕陽</button>
    <button class="ctrl-btn time-btn" id="btn-night" onclick="setTimeMode('night', this)">🌙 漁火夜景</button>
    <span style="color:#c5d8e2; user-select:none;">|</span>
    <button class="ctrl-btn active" id="btn-map-blend" onclick="toggleMapChartMode()" title="切換海圖波浪融合度">🗺️ 海圖波浪</button>
    <button class="ctrl-btn" id="btn-proj" onclick="toggleProjectionMode()">📐 等距微縮</button>
    <button class="ctrl-btn" onclick="setOverviewCamera()">🌐 全景</button>
    <button class="ctrl-btn" onclick="setTopView()">🧭 海圖俯視</button>
  </div>

  <!-- 彈出視窗模組 -->
  <div id="main-modal" class="modal-overlay" onclick="onModalOverlayClick(event)">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modal-content-area"></div>
    </div>
  </div>

  <!-- 主邏輯程式碼 (ESM - 微縮實物模型 + 即時頂點波浪海圖 + 雙向航行客輪) -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    function setEnvironmentEmissive(winIntensity, lanternBase, baiquanBase, beamOpacity, pointIntensity) {
      windowGlowMaterials.forEach(m => { m.emissiveIntensity = winIntensity; });

    // =================================================================
    // 4. 即時海洋頂點波浪 + 「馬祖・四鄉五島」海圖紋理融合
    // =================================================================
    function setupVertexWaveMapOcean() {
      const texLoader = new THREE.TextureLoader();
      const mapTex = texLoader.load(MATSU_MAP_URI);
      mapTex.colorSpace = THREE.SRGBColorSpace;
      mapTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      mapTex.minFilter = THREE.LinearMipmapLinearFilter;
      mapTex.magFilter = THREE.LinearFilter;
      mapTex.wrapS = THREE.ClampToEdgeWrapping;
      mapTex.wrapT = THREE.ClampToEdgeWrapping;
      oceanShaderUniforms.uMapTex.value = mapTex;

      // 高密度頂點波浪網格 (128 x 96 分割，具備真實頂點起伏與 Flat-Shading 折射波光)
      oceanGeo = new THREE.PlaneGeometry(92, 64, 128, 96);
      oceanGeo.rotateX(-Math.PI / 2);

      oceanPosAttr = oceanGeo.attributes.position;
      for (let i = 0; i < oceanPosAttr.count; i++) {
        oceanInitialY.push(oceanPosAttr.getY(i));
      }

      const oceanMat = new THREE.MeshStandardMaterial({
        color: 0x89cde3,
        roughness: 0.24,
        metalness: 0.08,
        flatShading: true
      });

      // 將上傳之「馬祖・四鄉五島」海圖直接投影於正在起伏的 3D 頂點波浪海面上！
      oceanMat.onBeforeCompile = (shader) => {
        shader.uniforms.uMapTex = oceanShaderUniforms.uMapTex;
        shader.uniforms.uMapSize = oceanShaderUniforms.uMapSize;
        shader.uniforms.uMapOpacity = oceanShaderUniforms.uMapOpacity;
        shader.uniforms.uNightDim = oceanShaderUniforms.uNightDim;
        shader.uniforms.uCrestColor = oceanShaderUniforms.uCrestColor;

        shader.vertexShader = `
          varying vec3 vWorldPos;
          varying float vWaveY;
        ` + shader.vertexShader;

        shader.vertexShader = shader.vertexShader.replace(
          '#include <begin_vertex>',
          `
          #include <begin_vertex>
          vWaveY = position.y;
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;
          `
        );

        shader.fragmentShader = `
          uniform sampler2D uMapTex;
          uniform vec2 uMapSize;
          uniform float uMapOpacity;
          uniform float uNightDim;
          uniform vec3 uCrestColor;
          varying vec3 vWorldPos;
          varying float vWaveY;
        ` + shader.fragmentShader;

        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <map_fragment>',
          `
          #include <map_fragment>
          vec2 mapUV = vec2(
            (vWorldPos.x / uMapSize.x) + 0.5,
            0.5 - (vWorldPos.z / uMapSize.y)
          );
          // 邊緣羽化遮罩，使海圖無縫融入四周無邊際頂點海洋
          vec2 edgeDist = abs(mapUV - vec2(0.5));
          float edgeMask = (1.0 - smoothstep(0.45, 0.50, edgeDist.x)) *
                           (1.0 - smoothstep(0.45, 0.50, edgeDist.y));
          if (mapUV.x >= 0.0 && mapUV.x <= 1.0 && mapUV.y >= 0.0 && mapUV.y <= 1.0) {
            vec4 chartColor = texture2D(uMapTex, mapUV);
            diffuseColor.rgb = mix(diffuseColor.rgb, chartColor.rgb * uNightDim, edgeMask * uMapOpacity);
          }
          // 頂點浪峰白沫高光
          float crest = smoothstep(0.045, 0.14, vWaveY) * 0.28;
          diffuseColor.rgb = mix(diffuseColor.rgb, uCrestColor, crest);
          `
        );
      };

      const wavePlane = new THREE.Mesh(oceanGeo, oceanMat);
      wavePlane.position.y = -0.05;
      wavePlane.receiveShadow = true;
      scene.add(wavePlane);
    }

    // 輔助函式：計算任意 (x, z) 海面即時波浪高度
    function getWaveHeightAt(x, z, t) {
      return Math.sin(x * 0.24 + t * 1.8) * 0.068 +
             Math.cos(z * 0.24 + t * 1.45) * 0.058 +
             Math.sin((x + z) * 0.35 - t * 2.2) * 0.025;
    }

    // =================================================================
    // 5. 微縮迷你實物模型群島建構 (多層次地形 + 四鄉五島特色地標)
    // =================================================================
    // 建立單一微縮地形山體區塊 (含浪花圈、金沙岩岸、翠綠草坡與山峰)
    function addSculptedTerrainLobe(parent, x, z, radius, height, scaleX = 1.0, scaleZ = 1.0, rotY = 0) {
      const lobe = new THREE.Group();
      lobe.position.set(x, 0, z);
      lobe.rotation.y = rotY;
      lobe.scale.set(scaleX, 1, scaleZ);

      // 1. 海岸浪花裙邊
      const foamGeo = new THREE.RingGeometry(radius * 0.96, radius * 1.14, 9);
      const foamMat = ResourcePool.getMat('foamRingMat', () => new THREE.MeshBasicMaterial({
        color: 0xffffff, transparent: true, opacity: 0.72, side: THREE.DoubleSide
      }));
      const foam = new THREE.Mesh(foamGeo, foamMat);
      foam.rotation.x = -Math.PI / 2;
      foam.position.y = 0.01;
      lobe.add(foam);
      foamRings.push(foam);

      // 2. 金黃沙灘與花崗岩岸基座
      const beachGeo = new THREE.CylinderGeometry(radius * 0.92, radius * 1.04, 0.14, 9);
      const beachMat = ResourcePool.getMat('sandMat', () => new THREE.MeshStandardMaterial({
        color: 0xe6d2b2, roughness: 0.85, flatShading: true
      }));
      const beach = new THREE.Mesh(beachGeo, beachMat);
      beach.position.y = 0.07;
      beach.receiveShadow = true;
      beach.castShadow = true;
      lobe.add(beach);

      // 3. 翠綠微縮草坡層
      const turfGeo = new THREE.CylinderGeometry(radius * 0.76, radius * 0.91, height * 0.55, 9);
      const turfMat = ResourcePool.getMat('turfMat', () => new THREE.MeshStandardMaterial({
        color: 0x67a340, roughness: 0.78, flatShading: true
      }));
      const turf = new THREE.Mesh(turfGeo, turfMat);
      turf.position.y = 0.14 + (height * 0.55) / 2;
      turf.receiveShadow = true;
      turf.castShadow = true;
      lobe.add(turf);

      // 4. 森林山脊層
      const hillGeo = new THREE.CylinderGeometry(radius * 0.42, radius * 0.74, height * 0.52, 8);
      const hillMat = ResourcePool.getMat('hillMat', () => new THREE.MeshStandardMaterial({
        color: 0x457d2e, roughness: 0.82, flatShading: true
      }));
      const hill = new THREE.Mesh(hillGeo, hillMat);
      hill.position.y = 0.14 + height * 0.55 + (height * 0.52) / 2 - 0.03;
      hill.receiveShadow = true;
      hill.castShadow = true;
      lobe.add(hill);

      parent.add(lobe);
      return 0.14 + height * 1.04; // 回傳山頂基準高程
    }

    function buildMiniatureDioramaArchipelago() {
      const greenTreeTransforms = [];

      DATA.islands.forEach((isleData, index) => {

        badgeDiv.id = `badge-${isleData.id}`;
        badgeDiv.innerHTML = `<span class="pill-num">${isleData.num}</span><span>${isleData.badgeTitle}</span>`;
        badgeDiv.onclick = (e) => {
          e.stopPropagation();

          selectIsland(isleData.id);

        const labelObj = new CSS2DObject(badgeDiv);

        group.add(labelObj);

        if (isleData.id === 'nangan') buildNanganDiorama(group, greenTreeTransforms, blossomTreeTransforms, isleData.pos);
        else if (isleData.id === 'beigan') buildBeiganDiorama(group, greenTreeTransforms, blossomTreeTransforms, isleData.pos);
        else if (isleData.id === 'dongyin') buildDongyinDiorama(group, greenTreeTransforms, blossomTreeTransforms, isleData.pos);
        else if (isleData.id === 'chukuang') buildChukuangDiorama(group, greenTreeTransforms, blossomTreeTransforms, isleData.pos);

        // 標記整座微縮島嶼與地標皆可點擊互動
        group.traverse(child => {
          if (child.isMesh) {
            child.userData.isleId = isleData.id;
            interactivePickMeshes.push(child);
          }
        });

    function buildInstancedTrees(transforms, hexColor) {
      if (!transforms.length) return;
      const treeGeo = ResourcePool.getGeo('treeCrown', () => new THREE.DodecahedronGeometry(0.18, 1));
      const treeMat = new THREE.MeshStandardMaterial({ color: hexColor, roughness: 0.86, flatShading: true });
      const instMesh = new THREE.InstancedMesh(treeGeo, treeMat, transforms.length);
      instMesh.castShadow = true;
      instMesh.receiveShadow = true;

      transforms.forEach((t, idx) => {
        _v3A.set(t.x, t.y, t.z);
        _quat.setFromAxisAngle(_upVec, idx * 1.1);
        _scale.setScalar(t.s);
        _mat4.compose(_v3A, _quat, _scale);
        instMesh.setMatrixAt(idx, _mat4);
      });
      instMesh.instanceMatrix.needsUpdate = true;
      instMesh.matrixAutoUpdate = false;
      instMesh.updateMatrix();
      scene.add(instMesh);
    }

    // =================================================================
    // 6. 雙向航行客輪系統 (3 條主航道 × 去返雙向對開 = 6 艘立體客輪)
    // =================================================================
    function buildBidirectionalFerryFleet() {
      const routeCorridors = [
        {
          // 航道 1：北竿 ⇄ 東引 (臺馬之星雙向航線，貼合底圖右上白色虛線)
          speed: 0.075,
          outboundColor: { hull: 0x1c4966, cabin: 0xd9534f },
          inboundColor:  { hull: 0xffffff, cabin: 0x1c6472 },
          points: [
            new THREE.Vector3(4.1, 0.03, -1.5),
            new THREE.Vector3(5.8, 0.03, -1.7),
            new THREE.Vector3(7.4, 0.03, -2.3),
            new THREE.Vector3(8.5, 0.03, -3.5)
          ]
        },
        {
          // 航道 2：北竿白沙 ⇄ 南竿福澳 ⇄ 莒光東莒 (南北之星雙向長航線，貼合底圖南側大弧虛線)
          speed: 0.058,
          outboundColor: { hull: 0xffffff, cabin: 0x2b6cb0 },
          inboundColor:  { hull: 0x24476b, cabin: 0xf0ad4e },
          points: [
            new THREE.Vector3(1.6, 0.03, -0.4),
            new THREE.Vector3(0.4, 0.03, 1.4),
            new THREE.Vector3(-1.6, 0.03, 2.6),
            new THREE.Vector3(-4.2, 0.03, 3.1),
            new THREE.Vector3(-6.2, 0.03, 2.9)
          ]
        },
        {
          // 航道 3：南竿西側 ⇄ 西莒/東莒 (東海明珠雙向航線，貼合底圖左側虛線)
          speed: 0.082,
          outboundColor: { hull: 0xfdfdfd, cabin: 0xd4652f },
          inboundColor:  { hull: 0xffffff, cabin: 0x6c4f8f },
          points: [
            new THREE.Vector3(-5.2, 0.03, 0.3),
            new THREE.Vector3(-6.8, 0.03, 0.6),
            new THREE.Vector3(-8.2, 0.03, 1.4),
            new THREE.Vector3(-9.1, 0.03, 2.2)
          ]
        }
      ];

      routeCorridors.forEach((corridor, cIdx) => {
        const curve = new THREE.CatmullRomCurve3(corridor.points, false, 'centripetal', 0.5);

        // 雙向對開：去程 (direction = +1) 與 返程 (direction = -1)，各自保持右舷航道偏移避免碰撞
        const shipOut = createDetailedFerry(corridor.outboundColor.hull, corridor.outboundColor.cabin, 1.0);
        const shipIn  = createDetailedFerry(corridor.inboundColor.hull, corridor.inboundColor.cabin, 0.95);
        scene.add(shipOut, shipIn);

        bidirectionalFleet.push(
          { curve, ship: shipOut, speed: corridor.speed, t: 0.15, dir: 1, laneOffset: 0.22, id: cIdx * 2 },
          { curve, ship: shipIn,  speed: corridor.speed, t: 0.85, dir: -1, laneOffset: 0.22, id: cIdx * 2 + 1 }
        );
      });
    }

    function createDetailedFerry(hullColor, cabinColor, scale = 1.0) {
      const ship = new THREE.Group();

      // 船體下艙
      const hull = new THREE.Mesh(

      // 彩色駕駛台與煙囪
      const bridge = new THREE.Mesh(
        ResourcePool.getGeo('shipBridge', () => new THREE.BoxGeometry(0.20, 0.10, 0.16)),
        new THREE.MeshStandardMaterial({ color: cabinColor, roughness: 0.5 })

      return ship;
    }

    // =================================================================
    // 7. 純 Web Audio 海潮環境音合成器
    // =================================================================
    let audioCtx = null;
    let isAudioPlaying = false;

    window.toggleAudio = function() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        buildOceanSoundSynthesizer();
      }
      const icon = document.getElementById('audio-icon');
      if (isAudioPlaying) {
        audioCtx.suspend();
        isAudioPlaying = false;
        icon.innerText = '🔇';
      } else {
        audioCtx.resume();
        isAudioPlaying = true;
        icon.innerText = '🔊';
      }
    };

    function buildOceanSoundSynthesizer() {
      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.08;
        b6 = white * 0.115926;
      }

      const noiseNode = audioCtx.createBufferSource();
      noiseNode.buffer = noiseBuffer;
      noiseNode.loop = true;

      const filterNode = audioCtx.createBiquadFilter();
      filterNode.type = 'lowpass';
      filterNode.frequency.setValueAtTime(320, audioCtx.currentTime);

      const gainNode = audioCtx.createGain();
      gainNode.gain.setValueAtTime(0.35, audioCtx.currentTime);

      const lfo = audioCtx.createOscillator();
      lfo.frequency.setValueAtTime(0.12, audioCtx.currentTime);
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.setValueAtTime(260, audioCtx.currentTime);

      lfo.connect(lfoGain);
      lfoGain.connect(filterNode.frequency);

      noiseNode.connect(filterNode);
      filterNode.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      noiseNode.start();
      lfo.start();
    }

    // =================================================================
    // 8. 互動巡弋、Raycaster 拾取與運鏡控制
    // =================================================================
    let currentIndex = 0;
    let isAutoTour = true;
    let tourTimer = null;
    let isCameraFlying = false;
    const flyStartPos = new THREE.Vector3();
    const flyEndPos = new THREE.Vector3();
    const flyStartLook = new THREE.Vector3();
    const flyEndLook = new THREE.Vector3();
    let flyProgress = 0;

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let pointerStartX = 0;
    let pointerStartY = 0;
    let lastHoverCheck = 0;

    function setupPointerAndKeyboardInteractions() {
      window.addEventListener('pointerdown', (e) => {
        pointerStartX = e.clientX;
        pointerStartY = e.clientY;
      }, { passive: true });

      window.addEventListener('pointermove', (e) => {
        const now = performance.now();
        if (now - lastHoverCheck < 50) return;
        lastHoverCheck = now;

        if (e.target.closest('#brand-header, #top-dock, #detail-drawer, #bottom-control-bar, .modal-overlay')) {
          document.body.style.cursor = 'default';
          hoveredIslandId = null;
          return;
        }

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, activeCamera);

        const hits = raycaster.intersectObjects(interactivePickMeshes, false);
        if (hits.length > 0 && hits[0].object.userData.isleId) {
          hoveredIslandId = hits[0].object.userData.isleId;
          document.body.style.cursor = 'pointer';
        } else {
          hoveredIslandId = null;
          document.body.style.cursor = 'default';
        }
      }, { passive: true });

      window.addEventListener('pointerup', (e) => {
        const dx = Math.abs(e.clientX - pointerStartX);
        const dy = Math.abs(e.clientY - pointerStartY);
        if (dx > 6 || dy > 6) return;

        if (e.target.closest('#brand-header, #top-dock, #detail-drawer, #bottom-control-bar, .modal-overlay, #top-nav-ticker')) return;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, activeCamera);

        const hitList = raycaster.intersectObjects(interactivePickMeshes, false);
        if (hitList.length > 0 && hitList[0].object.userData.isleId) {
          stopAutoTour();
          selectIsland(hitList[0].object.userData.isleId);
        }
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (document.getElementById('main-modal').classList.contains('active')) closeModal();
          else closeDrawer();
        } else if (e.key === 'ArrowRight') {
          nextIsland();
        } else if (e.key === 'ArrowLeft') {
          prevIsland();
        } else if (e.key === ' ') {
          e.preventDefault();
          toggleAutoTour();
        } else if (['1', '2', '3', '4'].includes(e.key)) {
          stopAutoTour();
          const idx = parseInt(e.key, 10) - 1;
          if (DATA.islands[idx]) selectIsland(DATA.islands[idx].id);
        }
      });
    }

    function stopAutoTour() {
      isAutoTour = false;
      clearTimeout(tourTimer);
      updateTourButtonUI();

    function selectIsland(id) {
      const idx = DATA.islands.findIndex(isle => isle.id === id);
      if (idx !== -1) {
        currentIndex = idx;
        const isle = DATA.islands[idx];
        flyToTarget(isle.pos.x, isle.pos.z, isle);
        updateDrawerContent(isle);
        updateActiveBadge(isle.id);
        if (selectionRingMesh) {
          selectionRingMesh.visible = true;
          selectionRingMesh.position.set(isle.pos.x, 0.04, isle.pos.z);
        }
      }
    }

      DATA.islands.forEach(isle => {

    window.prevIsland = function() {
      stopAutoTour();
      currentIndex = (currentIndex - 1 + DATA.islands.length) % DATA.islands.length;
      selectIsland(DATA.islands[currentIndex].id);
    };

    window.nextIsland = function() {
      stopAutoTour();
      currentIndex = (currentIndex + 1) % DATA.islands.length;
      selectIsland(DATA.islands[currentIndex].id);
    };

    window.toggleAutoTour = function() {
      isAutoTour = !isAutoTour;
      updateTourButtonUI();
      if (isAutoTour) runAutoTourStep();
      else clearTimeout(tourTimer);
    };

    function updateTourButtonUI() {
      const btn = document.getElementById('btn-tour');
      if (isAutoTour) {
        btn.classList.add('active');
        btn.innerHTML = '⏸ 巡航中';
      } else {
        btn.classList.remove('active');
        btn.innerHTML = '▶ 自動巡航';
      }
    }

    function runAutoTourStep() {
      if (!isAutoTour) return;
      selectIsland(DATA.islands[currentIndex].id);
      currentIndex = (currentIndex + 1) % DATA.islands.length;
      clearTimeout(tourTimer);
      tourTimer = setTimeout(runAutoTourStep, 7500);
    }

    // =================================================================
    // 10. 逐幀渲染迴圈 (即時海洋頂點波浪 + 雙向航行客輪 + 燈塔旋轉發光)
    // =================================================================
    const clock = new THREE.Clock();
    let elapsedTime = 0;
    let isPageHidden = false;
    let frameCount = 0;
    let fpsAccumTime = 0;
    const perfHudEl = document.getElementById('perf-hud');

    function startClock() {
      runAutoTourStep();
    }

    function onVisibilityChange() {
      isPageHidden = document.hidden;
      if (isPageHidden) {
        clock.stop();
        if (audioCtx && isAudioPlaying) audioCtx.suspend();
      } else {
        clock.start();
        if (audioCtx && isAudioPlaying) audioCtx.resume();
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      if (isPageHidden) return;

      const delta = Math.min(clock.getDelta(), 0.1);
      elapsedTime += delta;

      frameCount++;
      fpsAccumTime += delta;
      if (fpsAccumTime >= 0.6 && perfHudEl) {
        const fps = Math.min(Math.round(frameCount / fpsAccumTime), 120);
        perfHudEl.innerText = `⚡ ${fps} FPS・頂點波浪`;
        frameCount = 0;
        fpsAccumTime = 0;
      }

      // 1. 即時海洋頂點波浪更新 (讓海圖水體產生真實 3D 頂點波浪起伏)
      if (oceanPosAttr) {
        for (let i = 0; i < oceanPosAttr.count; i++) {
          const vx = oceanPosAttr.getX(i);
          const vz = oceanPosAttr.getZ(i);
          const wh = getWaveHeightAt(vx, vz, elapsedTime);
          oceanPosAttr.setY(i, oceanInitialY[i] + wh);
        }
        oceanPosAttr.needsUpdate = true;
      }

      // 2. 東引與東莒白犬燈塔 360 度探照光束旋轉
      lightTowerBeams.forEach((b, idx) => {
        b.rotation.y += (idx === 0 ? 1.55 : -1.25) * delta;
      });

      // 3. 海岸浪花裙邊呼吸動畫
      const foamScale = 1.0 + Math.sin(elapsedTime * 2.6) * 0.025;
      foamRings.forEach(f => {
        f.scale.set(foamScale, foamScale, 1);
      });

      // 4. 雙向對開客輪航行與乘浪起伏 (去返雙向交會 + 右舷偏移)
      bidirectionalFleet.forEach(vessel => {
        vessel.t += vessel.speed * delta * vessel.dir;
        if (vessel.t > 1.0) vessel.t -= 1.0;
        if (vessel.t < 0.0) vessel.t += 1.0;

        vessel.curve.getPointAt(vessel.t, _v3A);
        vessel.curve.getTangentAt(vessel.t, _v3B);
        if (vessel.dir < 0) _v3B.negate();

        // 計算右舷側向偏移向量，使去程與返程雙向船隻平行交會不碰撞
        _v3Side.set(-_v3B.z, 0, _v3B.x).normalize();
        const wx = _v3A.x + _v3Side.x * vessel.laneOffset;
        const wz = _v3A.z + _v3Side.z * vessel.laneOffset;
        const waveY = getWaveHeightAt(wx, wz, elapsedTime);

        vessel.ship.position.set(wx, 0.02 + waveY * 0.65, wz);
        vessel.ship.rotation.y = Math.atan2(_v3B.x, _v3B.z) - Math.PI / 2;
        vessel.ship.rotation.z = Math.sin(elapsedTime * 3.2 + vessel.id) * 0.035;
      });

      // 5. 南竿媽祖神像燈籠 & 莒光白犬燈塔發光呼吸脈動
      if (mazuLanternGlow) {
        const pulse = Math.sin(elapsedTime * 3.2);
        mazuLanternGlow.material.emissiveIntensity = baseLanternEmissive + pulse * 0.4;
        if (mazuLanternHalo) mazuLanternHalo.scale.setScalar(1.0 + pulse * 0.15);
      }
      if (baiquanLampGlow) {
        const pulse2 = Math.cos(elapsedTime * 3.8);
        baiquanLampGlow.material.emissiveIntensity = baseBaiquanEmissive + pulse2 * 0.55;
        if (baiquanLampHalo) baiquanLampHalo.scale.setScalar(1.05 + pulse2 * 0.18);
      }

      // 6. 島嶼懸停微浮動與選中光環
      islandGroups.forEach(ig => {
        const targetY = (hoveredIslandId === ig.data.id) ? 0.09 : 0.0;
        ig.group.position.y = THREE.MathUtils.lerp(ig.group.position.y, targetY, 1 - Math.exp(-10 * delta));
      });

      if (selectionRingMesh && selectionRingMesh.visible) {
        const pulse = 1.0 + Math.sin(elapsedTime * 3.5) * 0.035;
        selectionRingMesh.scale.set(pulse, pulse, 1);
        selectionRingMesh.material.opacity = 0.68 + Math.sin(elapsedTime * 3.5) * 0.22;
      }

      // 7. 相機飛行插值
      if (isCameraFlying) {
        flyProgress += delta * 1.35;
        const t = Math.min(flyProgress, 1.0);
        const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

        activeCamera.position.lerpVectors(flyStartPos, flyEndPos, ease);
        controls.target.lerpVectors(flyStartLook, flyEndLook, ease);

        if (isOrthoMode) {
          const dist = activeCamera.position.distanceTo(controls.target);
          orthoCamera.zoom = THREE.MathUtils.clamp(25 / Math.max(dist, 6), 0.55, 2.8);
          orthoCamera.updateProjectionMatrix();
        }

        if (t >= 1.0) isCameraFlying = false;
      }

      controls.update();
      renderer.render(scene, activeCamera);
      labelRenderer.render(scene, activeCamera);
    }

    function onWindowResize() {
      const aspect = window.innerWidth / window.innerHeight;
      perspCamera.aspect = aspect;
      perspCamera.updateProjectionMatrix();

      const orthoSize = 11.5;
      orthoCamera.left = -orthoSize * aspect;
      orthoCamera.right = orthoSize * aspect;
      orthoCamera.top = orthoSize;
      orthoCamera.bottom = -orthoSize;
      orthoCamera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    }
